# Bij elke wijziging, op elke tak: vet, tests, staticcheck en govulncheck. main
# neemt alleen commits aan waarvoor deze test al geslaagd is. Acties en
# hulpmiddelen staan op een vaste versie, zodat niemand ze ongemerkt kan
# veranderen. De tests gebruiken geen netwerk, behalve govulncheck (de
# lekkendatabank van Go).
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
